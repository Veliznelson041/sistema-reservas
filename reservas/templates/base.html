{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'reservas/style.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{% url 'mis_reservas' %}">📅 Turnos<span>Pro</span></a>
      <nav class="nav-links">
        {% if user.is_authenticated %}
          <a href="{% url 'calendario' %}">Calendario</a>
          <a href="{% url 'crear_reserva' %}">Reservar</a>
          <a href="{% url 'mis_reservas' %}">Mis reservas</a>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}<button>Salir ({{ user.username }})</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}">Ingresar</a>
          <a href="{% url 'registro' %}">Registrarse</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container">
    {% for m in messages %}<div class="msg msg-{{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
