{% extends 'base.html' %}
{% block contenido %}
<div class="page-head">
  <div>
    <h1>Calendario</h1>
    <p>Hacé click en un horario libre para reservar.</p>
  </div>
  <a class="btn" href="{% url 'crear_reserva' %}">+ Nueva reserva</a>
</div>

<div class="card">
  <div class="toolbar">
    <label for="filtro" style="margin:0">Recurso</label>
    <select id="filtro">
      <option value="">Todos</option>
      {% for r in recursos %}<option value="{{ r.id }}">{{ r.nombre }}</option>{% endfor %}
    </select>
  </div>
  <div class="legend">
    <span><i style="background:#4f46e5"></i>Mis reservas</span>
    <span><i style="background:#94a3b8"></i>Ocupado por otros</span>
  </div>
  <div id="calendario"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script>
  const filtro = document.getElementById('filtro');
  const calendario = new FullCalendar.Calendar(document.getElementById('calendario'), {
    initialView: 'timeGridWeek',
    locale: 'es',
    timeZone: 'local',
    firstDay: 1,
    allDaySlot: false,
    slotMinTime: '08:00:00',
    slotMaxTime: '24:00:00',
    nowIndicator: true,
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay'
    },
    events: (info, ok, fail) => {
      const url = `{% url 'eventos_calendario' %}?recurso=${filtro.value}`;
      fetch(url).then(r => r.json()).then(ok).catch(fail);
    },
    dateClick: (info) => {
      const inicio = info.dateStr.slice(0, 16);
      window.location = `{% url 'crear_reserva' %}?inicio=${inicio}&recurso=${filtro.value}`;
    },
  });
  calendario.render();
  filtro.addEventListener('change', () => calendario.refetchEvents());
</script>
{% endblock %}
